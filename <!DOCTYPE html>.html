    // ================= 3D CYBER ANIMATION (CANVAS) =================
    function Cyber3DCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationId;

        let width = canvas.width = 320;
        let height = canvas.height = 240;

        const size = 60;
        const nodes = [
          [-size, -size, -size], [size, -size, -size], [size, size, -size], [-size, size, -size],
          [-size, -size, size], [size, -size, size], [size, size, size], [-size, size, size]
        ];

        const edges = [
          [0,1], [1,2], [2,3], [3,0],
          [4,5], [5,6], [6,7], [7,4],
          [0,4], [1,5], [2,6], [3,7]
        ];

        const particles = Array.from({ length: 40 }, () => ({
          x: (Math.random() - 0.5) * 240,
          y: (Math.random() - 0.5) * 240,
          z: (Math.random() - 0.5) * 240,
          size: Math.random() * 2 + 1,
          color: Math.random() > 0.5 ? '#ec4899' : '#a855f7'
        }));

        let rotX = 0.4;
        let rotY = 0.6;
        let targetX = 0;
        let targetY = 0;

        const onMove = (clientX, clientY) => {
          const rect = canvas.getBoundingClientRect();
          targetX = ((clientX - rect.left) / width - 0.5) * 2;
          targetY = ((clientY - rect.top) / height - 0.5) * 2;
        };

        const handleMouseMove = (e) => onMove(e.clientX, e.clientY);
        const handleTouchMove = (e) => {
          if (e.touches && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('touchmove', handleTouchMove, { passive: true });

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          rotY += 0.008 + (targetX * 0.04);
          rotX += 0.005 + (targetY * 0.04);

          const cx = width / 2;
          const cy = height / 2;
          const fov = 280;

          const project = (x, y, z) => {
            let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
            let z1 = z * Math.cos(rotY) + x * Math.sin(rotY);
            let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
            let z2 = z1 * Math.cos(rotX) + y * Math.sin(rotX);
            const scale = fov / (fov + z2 + 160);
            return { px: cx + x1 * scale, py: cy + y2 * scale, scale };
          };

          particles.forEach(p => {
            const pt = project(p.x, p.y, p.z);
            ctx.beginPath();
            ctx.arc(pt.px, pt.py, p.size * pt.scale, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
          });

          edges.forEach(([i, j]) => {
            const p1 = project(nodes[i][0], nodes[i][1], nodes[i][2]);
            const p2 = project(nodes[j][0], nodes[j][1], nodes[j][2]);

            ctx.beginPath();
            ctx.moveTo(p1.px, p1.py);
            ctx.lineTo(p2.px, p2.py);
            ctx.strokeStyle = '#d946ef';
            ctx.lineWidth = 2;
            ctx.stroke();
          });

          const center = project(0, 0, 0);
          ctx.beginPath();
          ctx.arc(center.px, center.py, 8 * center.scale, 0, Math.PI * 2);
          ctx.fillStyle = '#06b6d4';
          ctx.fill();

          animationId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationId);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('touchmove', handleTouchMove);
        };
      }, []);

      return (
        <div style={{ display: 'flex', justifyContent: 'center', margin: '10px 0' }}>
          <canvas ref={canvasRef} style={{ width: '320px', height: '240px' }} />
        </div>
      );
    }

      const [cases, setCases] = useState([]);
      const [isSyncing, setIsSyncing] = useState(true);

      // Realtime Cloud Listener
      useEffect(() => {
        const casesRef = db.ref('recovery_cases');
        casesRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const loadedCases = Object.keys(data).map(key => ({
              id: key,
              ...data[key]
            }));
            loadedCases.reverse();
            setCases(loadedCases);
          } else {
            setCases([]);
          }
          setIsSyncing(false);
        });

        return () => casesRef.off();
      }, []);

      const [step, setStep] = useState(1);
      const [issueType, setIssueType] = useState('');
      const [username, setUsername] = useState('');
      const [phone, setPhone] = useState('');

      // Fast Screenshot Compressor (Taaki cloud me 1 second me upload ho)
      const handleScreenshot = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const maxDim = 800;
              let w = img.width;
              let h = img.height;
              if (w > h && w > maxDim) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else if (h > maxDim) {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);
              setScreenshotPreview(compressedBase64);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      };

        setIsSubmitting(true);

            setIsSubmitting(false);
            setStep(3);

          {currentPage.startsWith('admin') && !isAdminUnlocked && (
            <div className="max-w-xs mx-auto my-16 p-6 bg-zinc-900 border border-zinc-800 rounded-3xl text-center space-y-3.5">
              <div className="text-3xl">🔒</div>
              <h3 className="text-base font-bold">Admin Portal Locked</h3>
              <p className="text-xs text-zinc-400">Enter master PIN to access (PIN: 9988)</p>
              <form onSubmit={handlePinUnlock} className="space-y-3">
                <input
                  type="password"
                  maxLength={6}
                  placeholder="••••"
                  value={adminPinInput}
                  onChange={(e) => setAdminPinInput(e.target.value)}
                  className="w-full text-center text-xl tracking-widest font-mono py-2 rounded-xl bg-zinc-800 border border-zinc-700 outline-none"
                />
                {pinError && <p className="text-xs text-red-400">{pinError}</p>}
                <button type="submit" className="w-full py-2 bg-pink-600 rounded-xl font-bold text-xs uppercase tracking-wider">
                  Unlock Portal ➔
                </button>
              </form>
            </div>
          )}

          {/* ADMIN 1: LEADS INBOX */}
          {currentPage === 'admin_leads' && isAdminUnlocked && (
            <div className="max-w-5xl mx-auto px-4 py-6 w-full flex-1">
              <div className="flex justify-between items-center mb-4 pb-2 border-b border-zinc-800">
                <div>
                  <h2 className="text-lg font-black text-pink-400 flex items-center gap-2">
                    Admin 1: Live Cloud Leads
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                  </h2>
                  <p className="text-xs text-zinc-400">Cases yahan bina page refresh kiye 1 second me aayenge.</p>
                </div>
                <button 
                  onClick={() => setCurrentPage('admin_pipeline')}
                  className="px-3 py-1.5 bg-indigo-600 text-xs font-bold rounded-xl"
                >
                  Pipeline Workboard ➔
                </button>
              </div>

              <div className="overflow-x-auto rounded-2xl border border-zinc-800 bg-zinc-900">
                <table className="w-full text-left text-xs text-zinc-300">
                  <thead className="bg-zinc-800 text-zinc-400 uppercase text-[10px]">
                    <tr>
                      <th className="p-3">Token</th>
                      <th className="p-3">Username</th>
                      <th className="p-3">Issue</th>
                      <th className="p-3">Handler</th>
                      <th className="p-3">Evidence</th>
                      <th className="p-3">WhatsApp</th>
                      <th className="p-3 text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-800">
                    {cases.filter(c => c.stage === 'inbox').length === 0 ? (
                      <tr>
                        <td colSpan={7} className="p-8 text-center text-zinc-500">
                          {isSyncing ? "Syncing with cloud..." : "Abhi koi naya case queue me nahi hai."}
                        </td>
                      </tr>
                    ) : (
                      cases.filter(c => c.stage === 'inbox').map((item) => (
                        <tr key={item.token} className="hover:bg-zinc-800/40">
                          <td className="p-3 font-mono font-bold text-pink-400">{item.token}</td>
                          <td className="p-3 font-bold text-white">@{item.username}</td>
                          <td className="p-3 text-zinc-300">{item.issueType}</td>
                          <td className="p-3 text-purple-400">{item.handler}</td>
                          <td className="p-3">
                            {item.screenshot ? (
                              <button 
                                onClick={() => setActiveImage(item.screenshot)} 
                                className="px-2 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-blue-400 font-semibold text-[11px]"
                              >
                                View SS 👁️
                              </button>
                            ) : (
                              <span className="text-zinc-600">No SS</span>
                            )}
                          </td>
                          <td className="p-3">
                            <a
                              href={`https://wa.me/${item.phone.replace(/[^0-9]/g, '')}?text=Hello%20@${item.username},%20we%20reviewed%20your%20Instagram%20case%20(${item.token}).`}
                              target="_blank"
                              rel="noreferrer"
                              className="px-2.5 py-1 rounded bg-emerald-600 text-white font-bold text-[11px]"
                            >
                              Chat 💬
                            </a>
                          </td>
                          <td className="p-3 flex gap-1 justify-center">
                            <button
                              onClick={() => acceptCase(item)}
                              className="px-2.5 py-1 bg-blue-600 text-white rounded font-bold"
                            >
                              Accept ➔
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ADMIN 2: ACTIVE WORKBOARD */}
          {currentPage === 'admin_pipeline' && isAdminUnlocked && (
            <div className="max-w-5xl mx-auto px-4 py-6 w-full flex-1">
              <div className="flex justify-between items-center mb-4 pb-2 border-b border-zinc-800">
                <div>
                  <h2 className="text-lg font-black text-indigo-400">Admin 2: Active Recovery Workboard</h2>
                  <p className="text-xs text-zinc-400">Yahan status change karo, client ke token tracker me live dikhega.</p>
                </div>
                <button 
                  onClick={() => setCurrentPage('admin_leads')}
                  className="px-3.5 py-1.5 bg-zinc-800 text-xs font-bold rounded-xl"
                >
                  ⬅ Back to Leads
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {cases.filter(c => c.stage === 'active').map((item) => (
                  <div key={item.token} className="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-2.5">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="font-mono text-xs text-pink-400 font-bold">{item.token}</span>
                        <h4 className="text-sm font-bold text-white">@{item.username}</h4>
                      </div>
                      <span className="text-[10px] text-zinc-400">{item.issueType}</span>
                    </div>

                    <div>
                      <label className="text-[10px] uppercase font-bold text-zinc-400 block mb-1">Live Status for Client</label>
                      <select
                        value={item.status}
                        onChange={(e) => updateCaseStatus(item, e.target.value)}
                        className="w-full bg-zinc-800 border border-zinc-700 text-xs rounded-xl p-2 text-zinc-200 outline-none"
                      >
                        <option value="Case Accepted & Under Review">Case Accepted & Under Review</option>
                        <option value="ID Verification Document Sent">ID Verification Document Sent</option>
                        <option value="Meta Appeal Submitted">Meta Appeal Submitted</option>
                        <option value="Waiting for Meta Specialist">Waiting for Meta Specialist</option>
                        <option value="Account Successfully Restored">Account Successfully Restored (Done ✓)</option>
                        <option value="Case Closed / Unrecoverable">Case Closed / Unrecoverable</option>
                      </select>
                    </div>

                    <div className="pt-2 border-t border-zinc-800 flex justify-between items-center text-xs">
                      {item.screenshot && (
                        <button onClick={() => setActiveImage(item.screenshot)} className="text-blue-400 underline">
                          View Screenshot 👁️
                        </button>
                      )}
                      <a href={`https://wa.me/${item.phone.replace(/[^0-9]/g, '')}`} target="_blank" rel="noreferrer" className="text-emerald-400 font-bold">
                        WhatsApp ➔
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* SCREENSHOT MODAL */}
          {activeImage && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-zinc-900 border border-zinc-700 p-4 rounded-2xl max-w-sm w-full">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs font-bold text-zinc-400">Error Screenshot</span>
                  <button onClick={() => setActiveImage(null)} className="text-xs text-zinc-400 hover:text-white font-bold">✕ Close</button>
                </div>
                <img src={activeImage} alt="Screenshot" className="w-full rounded-xl max-h-[65vh] object-contain bg-black" />
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-zinc-800 bg-zinc-950 py-4 px-4 text-center text-xs text-zinc-500">
            <p>© 2026 Meta Cyber Recovery Bureau. Directed by <span className="text-pink-400">@_mitu_111_</span></p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
